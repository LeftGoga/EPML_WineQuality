[mlflow]
# storage for the auth data (can be sqlite or a DB URI). When using postgres, ensure mlflow user can access it.
database_uri = postgresql://mlflow:mlflow@postgres:5432/mlflow

# required — default permission for non-admin users (READ | EDIT | MANAGE | NO_PERMISSIONS)
default_permission = READ

# initial admin credentials (use strong secrets in production)
# keep these keys — some deployments expect 'admin_username'/'admin_password' names,
# while others accept 'default_admin_username'/'default_admin_password'. Including both is harmless.
admin_username = admin
admin_password = password1234567890
default_admin_username = admin
default_admin_password = password1234567890

# Authorization hook for the builtin basic-auth app
authorization_function = mlflow.server.auth:authenticate_request_basic_auth

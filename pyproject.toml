[tool.poetry]
name = "wine_quality"
version = "0.1.0"
description = ""
authors = ["Egor Polyakov <leftgoga@yandex.ru>"]
readme = "README.md"
packages = [
    { include = "wine_quality", from = "src" }
]

[tool.poetry.dependencies]
python = ">=3.12"
pre-commit = ">=4.4.0,<5.0.0"
pandas = ">=2.3.3,<3.0.0"
scikit-learn = ">=1.7.2,<2.0.0"
matplotlib = ">=3.10.7,<4.0.0"
seaborn = ">=0.13.2,<0.14.0"
joblib = ">=1.5.2,<2.0.0"
streamlit = "^1.51.0"
bandit = "^1.9.1"
mlflow = "^3.7.0"
graphql-core = "^3.2.0"
dvc = "^3.64.0"
psycopg2 = "^2.9.11"
hydra-core = "^1.3.2"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
luigi = "^3.6.0"
clearml = "^1.15.0"

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
extra_checks = true
ignore_missing_imports = true
disable_error_code = ["no-redef", "attr-defined"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", "W", "F",
  "I",
  "B",
  "C4",
  "UP",
  "ARG",
  "PIE",
  "PL",
  "RUF",
]
ignore = [
  "E501",
  "B008",
  "PLR0913",
  "PLR2004",
  "RUF001",
  "RUF002",
  "RUF003"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["wine_quality"]

[tool.bandit]
exclude = [
    ".venv",
    "venv",
    "env",
    "tests",
    "__pycache__",
    "build"
]
skips = [
    "B101",
    "B311",
]
